name: Build Wheels for macOS

on:
  push:

jobs:
  build_wheels:
    strategy:
      matrix:
        python-version: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314"]
        os: [macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set cache platform bucket
      run: echo "CACHE_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET:-11.0}" >> "$GITHUB_ENV"

    - name: Restore wheel dependency cache
      id: wheel-deps-cache
      uses: actions/cache/restore@v4
      with:
        path: .cibw-dependencies
        key: wheel-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          wheel-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-
          wheel-deps-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"  # Use a fixed version for the setup step

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade twine cibuildwheel

    - name: Build wheels
      run: cibuildwheel --output-dir wheelhouse
      env:
        CIBW_PLATFORM: "macos"
        CIBW_BUILD: "${{ matrix.python-version }}-*"
        CIBW_ARCHS: "arm64"  # Only build for Apple Silicon
        CIBW_BUILD_VERBOSITY: "1"
        CIBW_ENVIRONMENT: "PYMIMIR_DEPENDENCY_PREFIX=.cibw-dependencies/wheels"

    - name: Save wheel dependency cache
      if: matrix.python-version == 'cp312' && steps.wheel-deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .cibw-dependencies
        key: wheel-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt', 'cmake/*.cmake') }}

    - name: Upload to PyPI
      if: github.ref == 'refs/heads/main' && github.repository_owner == 'simon-stahlberg'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --skip-existing --repository-url https://upload.pypi.org/legacy/ wheelhouse/*
