name: Build Wheels for Linux

on:
  push:

jobs:
  build_wheels:
    strategy:
      matrix:
        # These architectures are too rare in practice:
        # "i686" (32-bit x86), "ppc64le" (PowerPC), "s390x" (IBM Z), "armv7l" (32-bit ARM)
        # The user can still build Mimir locally if they need it.
        architecture: ["x86_64"]  # TODO: Add "aarch64"
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set cache platform bucket
      run: echo "CACHE_DEPLOYMENT_TARGET=linux" >> "$GITHUB_ENV"

    - name: Restore wheel dependency cache
      id: wheel-deps-cache
      uses: actions/cache/restore@v4
      with:
        path: .cibw-dependencies
        key: wheel-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt') }}
        restore-keys: |
          wheel-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-
          wheel-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"  # Use a fixed version for the setup step

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade twine cibuildwheel

    - name: Build wheels
      run: cibuildwheel --output-dir wheelhouse
      env:
        CIBW_PLATFORM: "linux"
        CIBW_BUILD: "${{ matrix.python-version }}-*"
        CIBW_ARCHS: "${{ matrix.architecture }}"
        CIBW_BUILD_VERBOSITY: "1"
        CIBW_ENVIRONMENT: "PYMIMIR_DEPENDENCY_PREFIX=.cibw-dependencies/wheels"

    - name: Save wheel dependency cache
      if: matrix.python-version == 'cp312' && steps.wheel-deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .cibw-dependencies
        key: wheel-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt') }}

#    - name: Upload to PyPI
