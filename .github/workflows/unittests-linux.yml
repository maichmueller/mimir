name: Googletest Unit Tests - Linux

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Mimir
      uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install python requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install typing_extensions

    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gdb

    # Restore must happen BEFORE the dependencies build so a hit actually
    # saves build time; the post-job phase saves the fresh install.
    - name: Cache built dependencies
      uses: actions/cache@v4
      with:
        path: dependencies/installs
        key: ${{ runner.os }}-unittests-deps-v2-${{ hashFiles('CMakeLists.txt', 'dependencies/**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-unittests-deps-v2-

    - name: Configure, Build, and Install Dependencies
      run: |
        cd dependencies
        cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dependencies/installs -DDEPENDENCIES_BUILD_NANOBIND=OFF
        cmake --build build
        cmake --install build/

    # Debug
    - name: Debug, Configure, and Build Mimir
      run: |
        cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -S . -B build_debug -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dependencies/installs
        cmake --build build_debug

    - name: Debug Test
      working-directory: build_debug/tests/unit
      run: GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ctest -V --output-on-failure

    # Release
    - name: Release, Configure, and Build Mimir
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -S . -B build_release -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dependencies/installs
        cmake --build build_release

    - name: Release Test
      working-directory: build_release/tests/unit
      run: GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ctest -V
