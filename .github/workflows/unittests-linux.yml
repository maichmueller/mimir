name: Googletest Unit Tests - Linux

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Mimir
      uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install python requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install typing_extensions

    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gdb

    # Restore must happen BEFORE the dependencies build so a hit actually
    # saves build time; the post-job phase saves the fresh install.
    - name: Cache built dependencies
      uses: actions/cache@v4
      with:
        path: dependencies/installs
        key: ${{ runner.os }}-unittests-deps-v2-${{ hashFiles('CMakeLists.txt', 'dependencies/**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-unittests-deps-v2-

    - name: Configure, Build, and Install Dependencies
      run: |
        cd dependencies
        cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dependencies/installs -DDEPENDENCIES_BUILD_NANOBIND=OFF
        cmake --build build
        cmake --install build/

    # Debug
    - name: Debug, Configure, and Build Mimir
      run: |
        cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -S . -B build_debug -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dependencies/installs
        cmake --build build_debug

    - name: Debug Test
      id: debug_test
      working-directory: build_debug/tests/unit
      continue-on-error: true
      run: GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ctest -V --output-on-failure

    # Temporary diagnostics for the SIGILL investigation.
    - name: Diagnose crashes (temporary)
      if: steps.debug_test.outcome == 'failure'
      working-directory: build_debug/tests/unit
      run: |
        set +e
        echo "=== CPU info ==="
        lscpu | grep -E "Model name|Flags" | cut -c1-400
        echo "=== Toolchain ==="
        gcc --version | head -1
        for t in datasets_knowledge_base_test datasets_object_graph_test graphs_algorithms_folklore_weisfeiler_leman_test languages_general_policies_general_policy_test search_brfs_test search_iw_test; do
          if [ -x "./$t" ]; then
            timeout 600 ./$t > /dev/null 2>&1
            echo "$t direct-exit=$?"
          fi
        done
        echo "=== gdb on search_iw_test ==="
        timeout 900 gdb -batch -ex run -ex 'info program' -ex 'info registers rip' -ex 'x/3i $pc' -ex 'info symbol $pc' -ex 'bt 15' --args ./search_iw_test 2>&1 | tail -45 || true
        echo "=== gdb on datasets_knowledge_base_test ==="
        timeout 900 gdb -batch -ex run -ex 'info program' -ex 'info registers rip' -ex 'x/3i $pc' -ex 'info symbol $pc' -ex 'bt 15' --args ./datasets_knowledge_base_test 2>&1 | tail -35 || true

    - name: Fail if Debug Test failed (temporary)
      if: steps.debug_test.outcome == 'failure'
      run: exit 1

    # Release
    - name: Release, Configure, and Build Mimir
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -S . -B build_release -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dependencies/installs
        cmake --build build_release

    - name: Release Test
      working-directory: build_release/tests/unit
      run: GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ctest -V
