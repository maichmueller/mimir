name: Pip - Macos

on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.11", "3.12", "3.14t"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: build/temp*/dependencies/installs
          key: ${{ runner.os }}-${{ matrix.python-version }}-deps-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-deps-

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools pytest

      - name: Build and install
        run: python -m pip install --verbose .[test]
        env:
          PYMIMIR_DEBUG_BUILD: 1

      - name: Test
        run: pytest python/tests
