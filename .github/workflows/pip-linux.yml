name: Pip - Linux

on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14t"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set cache platform bucket
        run: echo "CACHE_DEPLOYMENT_TARGET=linux" >> "$GITHUB_ENV"

      - name: Restore test dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .dependencies/installs
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            test-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-
            test-deps-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools pytest

      - name: Build and install
        run: python -m pip install --verbose .[test]
        env:
          PYMIMIR_DEBUG_BUILD: 1
          PYMIMIR_DEPENDENCY_PREFIX: .dependencies/installs

      - name: Save test dependency cache
        if: matrix.python-version == '3.12' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dependencies/installs
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_DEPLOYMENT_TARGET }}-${{ hashFiles('setup.py', 'CMakeLists.txt', 'dependencies/**/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Test
        run: pytest python/tests
