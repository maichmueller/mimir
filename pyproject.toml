[build-system]
requires = [
    "setuptools>=64",
    # nanobind 3.x: internals generation 22. ABI-critical and shared with every
    # extension that joins NB_DOMAIN=pymimir_abi_domain (hierarchical._core,
    # mifrost), so this pin and MIMIR_NANOBIND_VERSION in
    # dependencies/nanobind/CMakeLists.txt must move together with those.
    "nanobind>=3,<4",
    # Pinned below 4.x: CMake 4.0 introduced a regression in ExternalProject's
    # git-clone retry logic ("math cannot parse the expression: 1 + <project>")
    # which makes transient clone failures fatal.
    "cmake>=3.21,<4",
    "ninja",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
container-engine = "docker"
# Python >= 3.12 only. Free-threaded CPython ships as cp314t; cp313t was
# dropped from cibuildwheel 4.x, so 3.13t users must build from source.
build = "cp312-* cp313-* cp314-* cp314t-*"

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
